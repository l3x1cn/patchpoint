# PatchPoint: hasło z /api/auth/login i /api/auth/register trafia wyłącznie do Argon2id, nigdy do SQL, HTML
# ani powłoki. CRS go więc nie analizuje: silne hasła ze znakami ' " < > -- nie są blokowane, a fragmenty
# haseł nie trafiają do komunikatów reguł w audit logu. Pozostałe pola tych żądań CRS analizuje normalnie.
SecRule REQUEST_FILENAME "@rx ^/api/auth/(?:login|register)$" \
    "id:10001,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:password"
