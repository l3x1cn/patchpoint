---
patchpoint_seed_demo_data: false
patchpoint_ghcr_username: "{{ vault_ghcr_username }}"
patchpoint_ghcr_token: "{{ vault_ghcr_token }}"
patchpoint_demo_password: "{{ vault_patchpoint_demo_password | default('') }}"
letsencrypt_domain: "{{ patchpoint_domain }}"
letsencrypt_email: "{{ patchpoint_acme_email }}"
# Wspólne wartości roli patchpoint i letsencrypt: jedno źródło, żeby katalog wdrożenia i UID proxy nie
# rozjechały się między rolami (certbot musi pisać do katalogów montowanych przez proxy).
patchpoint_dir: /opt/patchpoint
patchpoint_proxy_uid: 101
letsencrypt_webroot: "{{ patchpoint_dir }}/acme"
letsencrypt_tls_dir: "{{ patchpoint_dir }}/tls"
letsencrypt_compose_dir: "{{ patchpoint_dir }}"
letsencrypt_proxy_uid: "{{ patchpoint_proxy_uid }}"
