<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PatchPoint — Helpdesk IT</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src http://patchpoint.localhost:8000; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <div class="container header-inner">
      <div>
        <h1>PatchPoint</h1>
        <p class="subtitle">System zgłoszeń awarii sprzętu IT</p>
      </div>
      <div id="user-bar" hidden>
        <span id="user-info"></span>
        <button type="button" id="logout-button">Wyloguj</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="message" role="status"></div>

    <section id="auth-view">
      <div class="auth-grid">
        <form id="login-form" class="card">
          <h2>Logowanie</h2>
          <label>Login
            <input type="text" name="username" required maxlength="50" autocomplete="username">
          </label>
          <label>Hasło
            <input type="password" name="password" required maxlength="128" autocomplete="current-password">
          </label>
          <button type="submit">Zaloguj</button>
        </form>

        <form id="register-form" class="card">
          <h2>Rejestracja</h2>
          <label>Login
            <input type="text" name="username" required minlength="3" maxlength="50">
          </label>
          <label>Imię i nazwisko
            <input type="text" name="full_name" required maxlength="100">
          </label>
          <label>Dział
            <input type="text" name="department" maxlength="100">
          </label>
          <label>Hasło
            <input type="password" name="password" required minlength="15" maxlength="128" autocomplete="new-password">
          </label>
          <button type="submit">Zarejestruj konto</button>
        </form>
      </div>
    </section>

    <section id="app-view" hidden>
      <form id="ticket-form" class="card">
        <h2>Nowe zgłoszenie</h2>
        <div class="form-grid">
          <label>Tytuł
            <input type="text" name="title" required maxlength="200">
          </label>
          <label>Kategoria
            <select name="category"></select>
          </label>
          <label>Priorytet
            <select name="priority"></select>
          </label>
          <label>Nr inwentarzowy
            <input type="text" name="asset_tag" maxlength="50">
          </label>
          <label>Lokalizacja
            <input type="text" name="location" maxlength="100">
          </label>
        </div>
        <label>Opis
          <textarea name="description" rows="4" required maxlength="5000"></textarea>
        </label>
        <button type="submit">Wyślij zgłoszenie</button>
      </form>

      <section class="card">
        <h2>Zgłoszenia</h2>
        <form id="filter-form" class="filter-form">
          <label>Status
            <select name="status">
              <option value="">Wszystkie</option>
            </select>
          </label>
          <label>Szukaj
            <input type="text" name="search" maxlength="100">
          </label>
          <button type="submit">Filtruj</button>
        </form>

        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Tytuł</th>
              <th>Kategoria</th>
              <th>Priorytet</th>
              <th>Status</th>
              <th>Zgłaszający</th>
              <th>Przypisany</th>
              <th>Utworzono</th>
            </tr>
          </thead>
          <tbody id="ticket-list"></tbody>
        </table>
        <div class="pagination">
          <button type="button" id="prev-page" disabled>Poprzednia</button>
          <span id="page-info">Strona 1</span>
          <button type="button" id="next-page" disabled>Następna</button>
        </div>
      </section>

      <section id="ticket-detail" class="card" hidden></section>
    </section>
  </main>
</body>
</html>
