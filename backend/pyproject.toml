[project]
name = "patchpoint-backend"
version = "0.1.0"
description = "PatchPoint — API systemu zgłoszeń IT (Faza 1, MVP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
